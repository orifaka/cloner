[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mafia-builder-saas"
version = "1.0.0"
description = "Telegram Builder Bot SaaS — deploys independent Mafia bot instances from owned template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram==3.22.0",
  "fastapi==0.115.0",
  "uvicorn[standard]==0.34.0",
  "SQLAlchemy[asyncio]==2.0.44",
  "asyncpg==0.30.0",
  "aiosqlite==0.21.0",
  "alembic==1.16.4",
  "pydantic==2.11.7",
  "pydantic-settings==2.11.0",
  "python-dotenv==1.1.1",
  "APScheduler==3.11.0",
  "redis==5.2.1",
  "httpx==0.28.1",
  "cryptography==44.0.2",
  "PyJWT==2.10.1",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.20",
  "jinja2==3.1.6",
  "itsdangerous==2.2.0",
  "docker==7.1.0",
  "aiofiles==24.1.0",
  "orjson==3.10.16",
  "psutil==7.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "ruff==0.11.2"]

[tool.setuptools]
package-dir = {"" = "packages/core", "platform_billing" = "packages/billing/platform_billing", "platform_deploy" = "packages/deploy/platform_deploy", "platform_monitoring" = "packages/monitoring/platform_monitoring"}

[tool.setuptools.packages.find]
where = ["packages/core", "packages/billing", "packages/deploy", "packages/monitoring"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
